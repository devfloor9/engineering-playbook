<p>These are examples to validate against your workload and SLO, not measured benchmarks or universal EKS recommendations.</p><figure data-ep-theme="manual" class="frame " style="--table-min-width:0" aria-labelledby="_R_2_-title"><figcaption id="_R_2_-title" class="caption">Example CoreDNS performance targets</figcaption><div class="scroller" role="region" aria-labelledby="_R_2_-title"><table aria-labelledby="_R_2_-title"><thead><tr><th scope="col">Metric</th><th scope="col">Example target</th><th scope="col">Example investigation trigger</th><th scope="col">Scope</th></tr></thead><tbody><tr><th scope="row">Query Latency (P99)</th><td>&lt; 50ms</td><td>&gt; 50ms / 5m</td><td>Trial threshold used in the appendix. Evaluate with traffic and adjust to the SLO</td></tr><tr><th scope="row">Throughput (QPS/Pod)</th><td>Determine by load test</td><td>Growth with latency/saturation</td><td>Low QPS alone is not a failure. Capacity depends on query mix and resources</td></tr><tr><th scope="row">Cache Hit Ratio</th><td>&gt; 80%</td><td>&lt; 50%</td><td>Trial values for workloads with repeated queries. TTL 30s does not guarantee this hit ratio</td></tr><tr><th scope="row">Error Rate (SERVFAIL)</th><td>&lt; 0.1%</td><td>&gt; 1%</td><td>Trial SERVFAIL ratio over all responses. Excludes expected NXDOMAIN</td></tr><tr><th scope="row">CPU Utilization</th><td>&lt; 60%</td><td>&gt; 80%</td><td>Percent of the configured CPU limit, if present. Evaluate alongside actual throttling</td></tr><tr><th scope="row">Memory Utilization</th><td>&lt; 120Mi</td><td>&gt; 150Mi</td><td>Example only for a deployment with an actual 170Mi limit. Not an EKS default or measured result</td></tr></tbody></table></div></figure><p>Plugin baseline sources: <a href="https://github.com/coredns/coredns/blob/v1.11.3/plugin/forward/forward.go">forward v1.11.3</a> · <a href="https://github.com/coredns/coredns/blob/v1.11.3/plugin/health/health.go">health v1.11.3</a></p><figure data-ep-theme="manual" class="frame " style="--table-min-width:0" aria-labelledby="_R_4_-title"><figcaption id="_R_4_-title" class="caption">CoreDNS tuning parameters</figcaption><div class="scroller" role="region" aria-labelledby="_R_4_-title"><table aria-labelledby="_R_4_-title"><thead><tr><th scope="col">Parameter</th><th scope="col">Baseline scope</th><th scope="col">Trial value</th><th scope="col">Scope</th></tr></thead><tbody><tr><th scope="row"><code>max_concurrent</code></th><td>v1.11.3: no cap when omitted</td><td>2000</td><td>Trial value. Size from upstream QPS × latency plus headroom; allow roughly 2KB per query</td></tr><tr><th scope="row"><code>Replica Count</code></th><td>Inspect current Deployment</td><td>Auto-proportional</td><td>Evaluate supported EKS add-on autoscaling or Cluster Proportional Autoscaler</td></tr><tr><th scope="row"><code>lameduck</code></th><td>v1.11.3: no delay when omitted</td><td>5s</td><td>Trial value. Check /ready and endpoint propagation; allow headroom in the Pod grace period</td></tr></tbody></table></div></figure><p><strong>Benchmark tool: </strong><code>dnsperf -s &lt;COREDNS_IP&gt; -d queries.txt -c 10 -T 10</code> to measure CoreDNS QPS and latency.</p>
