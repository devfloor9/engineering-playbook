<figure><figcaption id="_R_jnm7dalbah_">CoreDNS 성능 목표 예시</figcaption><div><table><thead><tr><th scope="col">지표</th><th scope="col">목표 예시</th><th scope="col">조사 기준 예시</th><th scope="col">적용 조건</th></tr></thead><tbody><tr><th scope="row">쿼리 지연 (P99)</th><td>&lt; 50ms</td><td>&gt; 50ms / 5m</td><td>부록의 시험 임계치. 트래픽이 있을 때 평가하고 SLO에 맞게 조정</td></tr><tr><th scope="row">처리량 (QPS/Pod)</th><td>부하 시험으로 결정</td><td>지연·포화 동반 증가</td><td>낮은 QPS만으로 장애를 판단하지 않음. 쿼리 구성과 리소스에 따라 용량이 달라짐</td></tr><tr><th scope="row">캐시 적중률</th><td>&gt; 80%</td><td>&lt; 50%</td><td>반복 질의가 많은 워크로드의 시험값. TTL 30s가 이 적중률을 보장하지 않음</td></tr><tr><th scope="row">오류율 (SERVFAIL)</th><td>&lt; 0.1%</td><td>&gt; 1%</td><td>전체 응답 대비 SERVFAIL 비율의 시험값. 예상 NXDOMAIN 제외</td></tr><tr><th scope="row">CPU 사용률</th><td>&lt; 60%</td><td>&gt; 80%</td><td>CPU limit이 설정된 경우 그 값 대비 비율. 실제 throttling과 함께 평가</td></tr><tr><th scope="row">메모리 사용률</th><td>&lt; 120Mi</td><td>&gt; 150Mi</td><td>실제 메모리 limit이 170Mi인 배포만의 예시. EKS 공통 기본값이나 측정 결과가 아님</td></tr></tbody></table></div></figure>
