name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate tag pages
        run: npm run generate-tags

      - name: Verify generated tag routes
        run: npm run test:tags

      - name: Verify document tools
        run: npm run test:tools

      - name: Verify LLM wiki component exports
        run: npm run test:llm-wiki

      - name: Verify link validator regressions
        run: npm run test:links

      - name: Verify streamed Unicode text and anchors
        run: npm run test:ssr

      - name: Verify document revision metadata
        run: npm run test:metadata

      - name: Build website
        run: npm run build

      - name: Generate llms.txt (llmstxt.org)
        run: npm run generate-llms

      - name: Generate LLM Wiki (per-page markdown + manifest)
        run: npm run generate-llm-wiki

      - name: Verify internal routes and fragments
        run: >-
          node scripts/validate-links.js --build-dir build
          --json link-check-internal.json
          --markdown link-check-internal.md

      - name: Upload internal link findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-link-check
          path: |
            link-check-internal.json
            link-check-internal.md
          if-no-files-found: warn

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
