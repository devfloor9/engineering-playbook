name: Link Checker

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'i18n/**'
      - 'src/pages/**'
      - 'static/**'
      - 'scripts/validate-links.js'
      - 'scripts/tests/validate-links.test.js'
      - 'docusaurus.config.*'
      - 'package*.json'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: External link findings (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify link validator regressions
        run: node --test scripts/tests/validate-links.test.js

      # The validator sends only extracted HTTP(S) URLs to the network checker.
      # Extensionless Docusaurus routes never become filesystem inputs here.
      # The build workflow must run the internal validator after producing build/.
      - name: Collect external findings
        run: >-
          node scripts/validate-links.js
          --external-only --advisory
          --timeout-ms 10000 --concurrency 8
          --json link-check-report.json
          --markdown link-check-report.md

      - name: Publish advisory status and counts
        if: always()
        run: |
          if [ -f link-check-report.md ]; then
            cat link-check-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Link validation did not finish. No link-validity conclusion is available.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload detailed findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: |
            link-check-report.json
            link-check-report.md
          if-no-files-found: error
          retention-days: 30
